# Module-specific Gradle properties for navigation-impl module
# JVM memory settings - reduced for library modules
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Gradle optimizations
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin incremental compilation
kotlin.incremental=true

# KSP incremental processing
ksp.incremental=true
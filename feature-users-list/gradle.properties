# =============================================================================
# Module-specific Gradle properties for feature-users-list module
# Optimized for Android feature modules in composite builds
# Gradle 9.0.0 + Android 8.12.2 Optimizations
# LATEST OPTIMIZATIONS: 2024 Research-Based Updates
# =============================================================================

# =============================================================================
# ESSENTIAL ANDROID PROPERTIES (REQUIRED)
# =============================================================================
# Android settings (required for Android modules)
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# NEW: AGP 8.12.2 specific optimizations
android.enableResourceOptimizations=true

# =============================================================================
# ESSENTIAL KOTLIN PROPERTIES (REQUIRED)
# =============================================================================
# Kotlin incremental compilation
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.code.style=official

# NEW: Kotlin 2.2.0 specific optimizations
kotlin.incremental.compiler.gradle=true

# =============================================================================
# ESSENTIAL KSP PROPERTIES (REQUIRED)
# =============================================================================
# KSP annotation processing
ksp.incremental=true

# NEW: Enhanced KSP for AGP 8.12.2
ksp.useWorkerApi=true
ksp.verbose=false

# =============================================================================
# GRADLE 9.0.0 MODULE LATEST OPTIMIZATIONS
# =============================================================================
# Parallel execution, build cache, and configuration cache are ENABLED BY DEFAULT in Gradle 9.0.0
# JVM memory settings optimized for feature modules
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# NEW: Enhanced module performance
org.gradle.workers.max=4
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# =============================================================================
# FEATURE MODULE LATEST OPTIMIZATIONS
# =============================================================================
# Feature module specific optimizations
android.lifecycleProcessor.incremental=true

# NEW: Enhanced feature module optimizations
# Compose compiler optimizations are ENABLED BY DEFAULT in AGP 8.12.2

# =============================================================================
# ANDROIDX TEST LATEST CONFIGURATION
# =============================================================================
# AndroidX Test configuration for feature modules
android.experimental.testOptions.managedDevices.setupTimeoutMinutes=20
android.experimental.testOptions.managedDevices.emulator.showKernelLogging=true

# NEW: Enhanced test configuration
android.enableComposeCompilerReportsToFile=true

# NEW: Missing Build Feature Optimizations
# =============================================================================
# BUILD FEATURES OPTIMIZATION
# =============================================================================
# Build Features Optimization (from Android Build Guide)
android.buildFeatures.buildConfig=false
android.buildFeatures.viewBinding=true
android.buildFeatures.dataBinding=false

# NEW: Test Optimization Settings
android.experimental.testOptions.managedDevices.setupTimeoutMinutes=10
android.experimental.testOptions.managedDevices.emulator.showKernelLogging=false

# NEW: Resource Processing Optimization
android.enableResourceOptimizations=true

# =============================================================================
# COMPOSITE BUILD LATEST OPTIMIZATIONS
# =============================================================================
# Feature module specific settings for composite builds
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache-problems=warn

# NEW: Enhanced composite build settings
org.gradle.unsafe.isolated-projects=true
org.gradle.caching.reuse=true

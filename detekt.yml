build:
  maxIssues: 100
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

console-reports:
  active: true
  exclude:
     - 'ProjectStatisticsReport'
     - 'ComplexityReport'
     - 'NotificationReport'


naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  ConstructorParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'
    privateParameterPattern: '[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'
  EnumNaming:
    active: true
    enumEntryPattern: '[A-Z][_a-zA-Z0-9]*'
  FunctionNaming:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'
    ignoreAnnotated: ['Composable']  # ✅ Compose: @Composable functions can use PascalCase

  FunctionParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*'
  TopLevelPropertyNaming:
    active: true
    # ✅ Compose: Use PascalCase for constants (e.g., FooPadding instead of FOO_PADDING)
    constantPattern: '[A-Z][A-Za-z0-9]*'  # Updated from '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'
  VariableNaming:
    active: true
    variablePattern: '[a-z][A-Za-z0-9]*'
    privateVariablePattern: '(_)?[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'

# ✅ UPDATED: Disable formatting rules since ktlint handles them
# This prevents conflicts and ensures consistent formatting
formatting:
  active: false  # Ktlint handles all formatting rules

complexity:
  active: true
  ComplexCondition:
    active: true
    threshold: 4
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreSingleWhenExpression: false
    ignoreSimpleWhenEntries: false
    ignoreNestingFunctions: false
  LargeClass:
    active: true
    threshold: 600
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    # ✅ Compose: Composables often have more parameters with default values
    functionThreshold: 8  # Increased from 6 for Compose
    constructorThreshold: 7
    ignoreDefaultParameters: true  # ✅ Compose: Ignore default parameters
    ignoreDataClasses: true
  NestedBlockDepth:
    active: true
    threshold: 4

style:
  active: true
  MagicNumber:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/presentation/**', '**/theme/**', '**/di/**', '**/UserRepositoryTest.kt']
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '3'
      - '4'
      - '5'
      - '6'
      - '7'
      - '8'
      - '12'  # IV_SIZE
      - '16'  # Common sizes
      - '32'  # Common sizes
      - '64'  # Common sizes
      - '128' # TAG_SIZE
      - '256' # KEY_SIZE
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true  # ✅ Compose: Ignore property declarations
    ignoreLocalVariableDeclaration: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true  # ✅ Compose: Ignore companion object properties
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreRanges: true
    ignoreExtensionFunctions: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
  ReturnCount:
    active: true
    max: 2
    excludedFunctions:
      - 'equals'
      - 'load'  # RemoteMediator pattern requires multiple returns
    excludeLabeled: false
    excludeReturnFromLambda: true
    excludeGuardClauses: false
  UnusedImports:
    active: false
  UnusedPrivateMember:
    active: true
    allowedNames: 'clearToken|getSecureConfiguration'  # Utility functions for future use
    # ✅ Compose: Ignore @Preview functions as they don't contribute to complexity
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: true
    excludeImports:
      - 'java.util.*'

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: false
  EmptyClassBlock:
    active: true
  EmptyElseBlock:
    active: true
  EmptyIfBlock:
    active: true
  EmptyTryBlock:
    active: true
  EmptyWhenBlock:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  TooGenericExceptionCaught:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/data/local/SecureTokenManager.kt']
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'Exception'
      - 'IllegalMonitorStateException'
      - 'NullPointerException'
      - 'IndexOutOfBoundsException'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: '_|(ignore|expected).*'

# ✅ UPDATED: Enhanced Compose rules for 2025
TooManyFunctions:
  active: true
  threshold: 25  # Increased threshold for Compose modules
  # ✅ Compose: Ignore @Preview functions as they don't contribute to complexity
  ignoreAnnotatedFunctions: ['Preview', 'Composable']

# ✅ NEW: Compose-specific function naming rule
ComposeFunctionNaming:
  active: true
  ignoreAnnotated: ['Composable', 'Preview']
  functionPattern: '[a-z][a-zA-Z0-9]*'

# ✅ NEW: Compose-specific property naming rule
ComposePropertyNaming:
  active: true
  ignoreAnnotated: ['Composable', 'Preview']
  propertyPattern: '[a-zA-Z][a-zA-Z0-9]*'
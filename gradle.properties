# JVM memory settings - optimized for build performance
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:+UseStringDeduplication

# Gradle performance optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.parallel=true
org.gradle.configureondemand=false
org.gradle.vfs.watch=true
org.gradle.unsafe.isolated-projects=true

devCatalog=true
useCompositeBuilds=true

# Worker API settings

# Android build optimizations
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.enableR8.fullMode=true
# Pinning Lint via AGP toolchain; remove experimental override for stability
# android.experimental.lint.version=8.13.0-alpha01
android.databinding.incremental=true
android.lifecycleProcessor.incremental=true

# Kotlin compiler optimizations
kotlin.code.style=official
kotlin.caching.enabled=true
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.parallel.tasks.in.project=true
kotlin.build.report.enable=false
kotlin.build.report.verbose=false
kotlin.daemon.useFallbackStrategy=false
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvm.options=-Xmx3g

# KSP optimizations
ksp.incremental=true
ksp.incremental.log=false

# Network settings
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=120000

# System properties
systemProp.file.encoding=UTF-8
systemProp.org.gradle.android.cache-fix.ignoreVersionCheck=true

# Repository URLs for publishing
# Replace these with your actual repository URLs
nexusUrl=https://your-nexus-server.com/repository
nexusSnapshotUrl=https://your-nexus-server.com/repository/maven-snapshots
nexusReleaseUrl=https://your-nexus-server.com/repository/maven-releases

# Repository Credentials
# IMPORTANT: In production, use environment variables or gradle-credentials-plugin
# Example: nexusUsername=${env.NEXUS_USERNAME}
# Example: nexusPassword=${env.NEXUS_PASSWORD}
nexusUsername=your-username
nexusPassword=your-password

# Alternative repository configurations (uncomment and configure as needed)
# artifactoryUrl=https://your-artifactory.com/artifactory
# artifactorySnapshotUrl=https://your-artifactory.com/artifactory/libs-snapshot-local
# artifactoryReleaseUrl=https://your-artifactory.com/artifactory/libs-release-local

# GitHub Packages (if using)
# githubPackagesUrl=https://maven.pkg.github.com/your-org/your-repo
# githubUsername=your-github-username
# githubToken=your-github-token

# Publishing configuration
# Set to true to sign artifacts (requires signing configuration)
signing.required=false
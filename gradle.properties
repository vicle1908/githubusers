# =============================================================================
# Gradle Properties for GitHubUsers Project
# Optimized for Composite Builds with Multiple Modules
# Gradle 9.0.0 + Android 8.12.2 Optimizations
# LATEST OPTIMIZATIONS: 2024 Research-Based Updates
# =============================================================================

# =============================================================================
# JVM MEMORY & PERFORMANCE SETTINGS (ENHANCED)
# =============================================================================
# JVM memory settings - optimized for large composite builds
# Increased MaxMetaspaceSize to prevent OutOfMemoryError during buildAll
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC

# =============================================================================
# GRADLE 9.0.0 LATEST OPTIMIZATIONS (RESEARCH-BASED)
# =============================================================================
# Configuration Cache - explicitly enabled for consistency
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Build Cache - explicitly enabled
org.gradle.caching=true

# NEW: Project Isolation for Composite Builds (Gradle 9.0.0)
# Temporarily disabled due to configuration cache issues
# org.gradle.unsafe.isolated-projects=true

# NEW: Enhanced Build Cache for Composite Builds
# NEW: Gradle 9.0.0 Performance Optimizations
org.gradle.problems.report=true

# =============================================================================
# GRADLE PERFORMANCE OPTIMIZATIONS (ENHANCED)
# =============================================================================
# Build cache and parallel execution are ENABLED BY DEFAULT in Gradle 9.0.0
# No need to explicitly enable - Gradle automatically uses them

# Build scan for performance analysis
# =============================================================================
# ANDROID GRADLE PLUGIN 8.12.2 LATEST OPTIMIZATIONS
# =============================================================================
# Android build optimizations
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# NEW: AGP 8.12.2 specific optimizations
android.enableR8.fullMode=true
android.enableResourceOptimizations=true

# NEW: Enhanced Android build performance
android.enableBuildConfigAsBytecode=true

# =============================================================================
# KOTLIN 2.2.10 LATEST OPTIMIZATIONS (RESEARCH-BASED)
# =============================================================================
# Kotlin compiler optimizations
kotlin.code.style=official
kotlin.caching.enabled=true
# Re-enabled incremental compilation - the issue was with deprecated properties
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
# REMOVED: kotlin.incremental.useClasspathSnapshot - This property was removed in Kotlin 2.2.0
kotlin.parallel.tasks.in.project=true
kotlin.build.report.enable=false
kotlin.build.report.verbose=false
kotlin.daemon.useFallbackStrategy=false
# KSP and Kotlin optimizations using modern ABI snapshots
kotlin.daemon.jvm.options=-Xmx4g

# NEW: Kotlin 2.2.10 specific optimizations
kotlin.incremental.compiler.gradle=true

# FIX: Enable Build Tools API for Kotlin 2.2.10 to prevent transform errors
kotlin.build.tools.api.enabled=true
# Suppress kotlin-compiler-embeddable warning
kotlin.suppress.buildtools.api.warning=true

# =============================================================================
# KSP LATEST OPTIMIZATIONS (AGP 8.12.2)
# =============================================================================
# KSP annotation processing optimizations
ksp.incremental=true
ksp.incremental.log=true
ksp.workers.isolation=false

# NEW: Enhanced KSP for AGP 8.12.2
ksp.useWorkerApi=true
ksp.verbose=false

# =============================================================================
# COMPOSE LATEST OPTIMIZATIONS
# =============================================================================
# Compose compiler optimizations
android.enableComposeCompilerReports=true
android.enableComposeCompilerMetrics=true

# NEW: Enhanced Compose optimizations
android.enableComposeCompilerReportsToFile=true

# =============================================================================
# COMPOSITE BUILD LATEST OPTIMIZATIONS (RESEARCH-BASED)
# =============================================================================
# Configuration Cache is ENABLED BY DEFAULT in Gradle 9.0.0
# No need to explicitly enable - Gradle automatically uses it

# NEW: Enhanced composite build settings
# Temporarily disabled due to configuration cache issues
# org.gradle.unsafe.isolated-projects=true
org.gradle.caching.reuse=true

# NEW: Dependency substitution optimizations
org.gradle.dependency.verification=lenient

# =============================================================================
# DEVELOPMENT SETTINGS
# =============================================================================
# Development mode settings
devCatalogEnabled=true

# =============================================================================
# ADVANCED PERFORMANCE SETTINGS (ENHANCED)
# =============================================================================
# Advanced Gradle optimizations
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false
org.gradle.workers.max=4
org.gradle.unsafe.watch-fs=true

# NEW: Enhanced debugging and monitoring
org.gradle.performance.enabled=true
org.gradle.performance.monitoring=true

# NEW: Daemon Performance Monitoring (from Gradle Daemon Guide)
# Enable daemon memory leak detection and monitoring
org.gradle.daemon.performance.enable-monitoring=true

# NEW: Missing Critical Optimizations from Official Gradle Guide
# =============================================================================
# JVM MEMORY & PERFORMANCE LATEST OPTIMIZATIONS
# =============================================================================
# JVM memory settings optimized for large composite builds (from Gradle Performance Guide)
# Note: Main JVM settings defined at the top of this file

# NEW: Configuration on Demand for Multi-Module Builds
org.gradle.configureondemand=true

# NEW: Parallel Test Execution
org.gradle.parallel.test=true

# NEW: Build Scan Integration
org.gradle.scan.acceptLicense=true

# NEW: Dependency Resolution Optimization
# NEW: Enhanced File System Watching
# NEW: Enhanced Build Cache Settings
org.gradle.caching.debug=false
org.gradle.caching.max-problems=5

# NEW: Memory optimization for large builds
org.gradle.parallel.max-workers=4

# =============================================================================
# NETWORK & SYSTEM SETTINGS
# =============================================================================
# Network timeouts for dependency resolution
systemProp.http.connectionTimeout=30000
systemProp.http.socketTimeout=120000

# System properties
systemProp.file.encoding=UTF-8
systemProp.org.gradle.android.cache-fix.ignoreVersionCheck=true

# =============================================================================
# PUBLISHING CONFIGURATION (COMMENTED OUT - CONFIGURE AS NEEDED)
# =============================================================================
# Repository URLs for publishing
# Replace these with your actual repository URLs
# nexusUrl=https://your-nexus-server.com/repository
# nexusSnapshotUrl=https://your-nexus-server.com/repository/maven-snapshots
# nexusReleaseUrl=https://your-nexus-server.com/repository/maven-releases

# Repository Credentials
# IMPORTANT: In production, use environment variables or gradle-credentials-plugin
# Example: nexusUsername=${env.NEXUS_USERNAME}
# Example: nexusPassword=${env.NEXUS_PASSWORD}
# nexusUsername=your-username
# nexusPassword=your-password

# Publishing configuration
# Set to true to sign artifacts (requires signing configuration)
# signing.required=false
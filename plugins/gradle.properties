# =============================================================================
# Module-specific Gradle properties for plugins module
# Build-logic module for convention plugins in composite builds
# Gradle 9.0.0 + Android 8.12.2 Optimizations
# LATEST OPTIMIZATIONS: 2024 Research-Based Updates
# =============================================================================

# =============================================================================
# ESSENTIAL GRADLE PROPERTIES (REQUIRED)
# =============================================================================
# Gradle plugin development settings
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC

# =============================================================================
# GRADLE 9.0.0 CONFIGURATION CACHE (ENHANCED)
# =============================================================================
# Configuration cache for build-logic modules
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# NEW: Enhanced configuration cache
org.gradle.configuration-cache.max-problems=5

# =============================================================================
# GRADLE PERFORMANCE LATEST OPTIMIZATIONS
# =============================================================================
# Build cache for task output reuse
org.gradle.caching=true

# Parallel execution for multi-core systems
org.gradle.parallel=true

# NEW: Enhanced parallel execution
org.gradle.workers.max=4
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# =============================================================================
# KOTLIN LATEST OPTIMIZATIONS FOR PLUGIN DEVELOPMENT
# =============================================================================
# Kotlin compiler optimizations for plugins
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true

# NEW: Kotlin 2.2.0 specific optimizations
kotlin.incremental.compiler.gradle=true

# =============================================================================
# PLUGIN DEVELOPMENT LATEST SETTINGS
# =============================================================================
# Plugin development optimizations
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache-problems=warn

# NEW: Enhanced plugin development settings
org.gradle.unsafe.isolated-projects=true
org.gradle.caching.reuse=true

# NEW: Missing Java Compilation Optimizations from Gradle Performance Guide
# =============================================================================
# JAVA COMPILATION OPTIMIZATION SETTINGS
# =============================================================================
# Java compilation fork optimization (from Gradle Performance Guide)
org.gradle.java.compile.fork=true

# Java compilation memory optimization
org.gradle.java.compile.maxMemory=2g

# Java compilation incremental optimization
org.gradle.java.compile.incremental=true

# Java compilation parallel optimization
org.gradle.java.compile.parallel=true

# =============================================================================
# DEVELOPMENT SETTINGS
# =============================================================================
# Development mode settings for plugin development
devCatalogEnabled=true
# =============================================================================
# Module-specific Gradle properties for catalog module
# Version catalog module for dependency management in composite builds
# Gradle 9.0.0 + Android 8.12.2 Optimizations
# LATEST OPTIMIZATIONS: 2024 Research-Based Updates
# =============================================================================

# =============================================================================
# ESSENTIAL GRADLE PROPERTIES (REQUIRED)
# =============================================================================
# Gradle settings for version catalog module
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC

# =============================================================================
# GRADLE 9.0.0 CONFIGURATION CACHE (ENHANCED)
# =============================================================================
# Configuration cache for catalog module
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# NEW: Enhanced configuration cache
org.gradle.configuration-cache.max-problems=5

# =============================================================================
# GRADLE PERFORMANCE LATEST OPTIMIZATIONS
# =============================================================================
# Build cache for task output reuse
org.gradle.caching=true

# Parallel execution for multi-core systems
org.gradle.parallel=true

# NEW: Enhanced parallel execution
org.gradle.workers.max=4
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# =============================================================================
# VERSION CATALOG LATEST OPTIMIZATIONS
# =============================================================================
# Version catalog specific settings
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache-problems=warn

# NEW: Enhanced version catalog settings
org.gradle.unsafe.isolated-projects=true
org.gradle.caching.reuse=true

# =============================================================================
# DEVELOPMENT SETTINGS
# =============================================================================
# Development mode settings for catalog module
devCatalogEnabled=true
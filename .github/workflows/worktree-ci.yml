name: Worktree CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      branch_pattern:
        description: 'Branch pattern to test (e.g., ai/**)'
        required: false
        default: 'ai/**'
        type: string

concurrency:
  group: worktree-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

permissions:
  contents: read

jobs:
  ai-branch-test:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ai/')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'ai/'))
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 36
        build-tools: 36.0.0
        ndk-version: '28.2.13676358'
        cmake-version: '4.1.1'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Run quality checks
      run: ./gradlew detektAll ktlintCheckAll lintAll --configuration-cache --build-cache

    - name: Run tests
      run: ./gradlew testAll integrationTest --configuration-cache --build-cache || echo "No integration tests found"

    - name: Verify Native Library Build
      run: |
        echo "Building native libraries for core-security module..."
        ./gradlew :core-security:assembleDebug --configuration-cache --build-cache --info
        
        # Check if native libraries were built
        if [ -d "core-security/build/intermediates/cxx" ]; then
          echo "✅ Native libraries build directory found"
          find core-security/build/intermediates/cxx -name "*.so" -type f | head -5 || echo "No .so files found yet"
        else
          echo "❌ Native libraries build directory not found"
        fi

    - name: Build debug and release
      run: |
        ./gradlew assembleDebugApp assembleReleaseApp --configuration-cache --build-cache

    - name: Verify Native Integration
      run: |
        echo "Checking native library integration in APK..."
        # Extract and examine the APK for native libraries
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "\.so$" || echo "No native libraries found in APK"
        else
          echo "Debug APK not found"
        fi

    - name: Compute artifact name
      id: artifact-name
      run: |
        BRANCH="${{ github.head_ref || github.ref_name }}"
        SAFE_BRANCH=$(echo "$BRANCH" | tr '/":<>|*?\\' '-')
        echo "name=ai-branch-build-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: |
          app/build/outputs/apk/debug/
          app/build/outputs/apk/release/
          app/build/outputs/bundle/release/
        retention-days: 7
        compression-level: 6
        if-no-files-found: ignore

    - name: Upload reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ steps.artifact-name.outputs.name }}-reports
        path: |
          **/build/reports/detekt/
          **/build/reports/tests/**
          **/build/reports/lint-results-*.html
        retention-days: 7
        compression-level: 6
        if-no-files-found: ignore

  feature-branch-test:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/'))
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 36
        build-tools: 36.0.0
        ndk-version: '28.2.13676358'
        cmake-version: '4.1.1'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Run quality checks
      run: ./gradlew detektAll ktlintCheckAll lintAll --configuration-cache --build-cache

    - name: Run tests
      run: ./gradlew testAll integrationTest --configuration-cache --build-cache || echo "No integration tests found"

    - name: Verify Native Library Build
      run: |
        echo "Building native libraries for core-security module..."
        ./gradlew :core-security:assembleDebug --configuration-cache --build-cache --info
        
        # Check if native libraries were built
        if [ -d "core-security/build/intermediates/cxx" ]; then
          echo "✅ Native libraries build directory found"
          find core-security/build/intermediates/cxx -name "*.so" -type f | head -5 || echo "No .so files found yet"
        else
          echo "❌ Native libraries build directory not found"
        fi

    - name: Build project
      run: ./gradlew assembleDebugApp assembleReleaseApp --configuration-cache --build-cache

    - name: Verify Native Integration
      run: |
        echo "Checking native library integration in APK..."
        # Extract and examine the APK for native libraries
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "\.so$" || echo "No native libraries found in APK"
        else
          echo "Debug APK not found"
        fi

    - name: Compute artifact name
      id: artifact-name
      run: |
        BRANCH="${{ github.head_ref || github.ref_name }}"
        SAFE_BRANCH=$(echo "$BRANCH" | tr '/":<>|*?\\' '-')
        echo "name=feature-branch-build-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: |
          app/build/outputs/apk/debug/
          app/build/outputs/apk/release/
          app/build/outputs/bundle/release/
        retention-days: 7
        compression-level: 6
        if-no-files-found: ignore

    - name: Upload reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ steps.artifact-name.outputs.name }}-reports
        path: |
          **/build/reports/detekt/
          **/build/reports/tests/**
          **/build/reports/lint-results-*.html
        retention-days: 7
        compression-level: 6
        if-no-files-found: ignore

  bugfix-branch-test:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/bugfix/')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'bugfix/'))
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 36
        build-tools: 36.0.0
        ndk-version: '28.2.13676358'
        cmake-version: '4.1.1'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Validate bugfix branch naming
      run: |
        BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        if [[ ! "$BRANCH_NAME" =~ ^bugfix/[a-zA-Z0-9_-]+$ ]]; then
          echo "❌ Invalid bugfix branch naming: $BRANCH_NAME"
          echo "Expected pattern: bugfix/<description>"
          exit 1
        fi
        echo "✅ Valid bugfix branch naming: $BRANCH_NAME"
    - name: Run quality checks
      run: ./gradlew detektAll ktlintCheckAll lintAll --configuration-cache --build-cache

    - name: Run tests
      run: ./gradlew testAll integrationTest --configuration-cache --build-cache || echo "No integration tests found"

    - name: Verify Native Library Build
      run: |
        echo "Building native libraries for core-security module..."
        ./gradlew :core-security:assembleDebug --configuration-cache --build-cache --info
        
        # Check if native libraries were built
        if [ -d "core-security/build/intermediates/cxx" ]; then
          echo "✅ Native libraries build directory found"
          find core-security/build/intermediates/cxx -name "*.so" -type f | head -5 || echo "No .so files found yet"
        else
          echo "❌ Native libraries build directory not found"
        fi

    - name: Build project
      run: ./gradlew assembleDebugApp assembleReleaseApp --configuration-cache --build-cache

    - name: Verify Native Integration
      run: |
        echo "Checking native library integration in APK..."
        # Extract and examine the APK for native libraries
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "\.so$" || echo "No native libraries found in APK"
        else
          echo "Debug APK not found"
        fi

    - name: Compute artifact name
      id: artifact-name
      run: |
        BRANCH="${{ github.head_ref || github.ref_name }}"
        SAFE_BRANCH=$(echo "$BRANCH" | tr '/":<>|*?\\' '-')
        echo "name=bugfix-branch-build-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: |
          app/build/outputs/apk/debug/
          app/build/outputs/apk/release/
          app/build/outputs/bundle/release/
        retention-days: 7
        compression-level: 6
        if-no-files-found: ignore

    - name: Upload reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ steps.artifact-name.outputs.name }}-reports
        path: |
          **/build/reports/detekt/
          **/build/reports/tests/**
          **/build/reports/lint-results-*.html
        retention-days: 7
        compression-level: 6
        if-no-files-found: ignore

  hotfix-branch-test:
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hotfix/')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 36
        build-tools: 36.0.0
        ndk-version: '28.2.13676358'
        cmake-version: '4.1.1'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Run quality checks
      run: ./gradlew detektAll ktlintCheckAll lintAll --configuration-cache --build-cache

    - name: Run tests
      run: ./gradlew testAll integrationTest --configuration-cache --build-cache || echo "No integration tests found"

    - name: Verify Native Library Build
      run: |
        echo "Building native libraries for core-security module..."
        ./gradlew :core-security:assembleDebug --configuration-cache --build-cache --info
        
        # Check if native libraries were built
        if [ -d "core-security/build/intermediates/cxx" ]; then
          echo "✅ Native libraries build directory found"
          find core-security/build/intermediates/cxx -name "*.so" -type f | head -5 || echo "No .so files found yet"
        else
          echo "❌ Native libraries build directory not found"
        fi

    - name: Build project
      run: ./gradlew assembleDebugApp assembleReleaseApp --configuration-cache --build-cache

    - name: Verify Native Integration
      run: |
        echo "Checking native library integration in APK..."
        # Extract and examine the APK for native libraries
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "\.so$" || echo "No native libraries found in APK"
        else
          echo "Debug APK not found"
        fi

    - name: Compute artifact name
      id: artifact-name
      run: |
        BRANCH="${{ github.head_ref || github.ref_name }}"
        SAFE_BRANCH=$(echo "$BRANCH" | tr '/":<>|*?\\' '-')
        echo "name=hotfix-branch-build-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: |
          app/build/outputs/apk/debug/
          app/build/outputs/apk/release/
          app/build/outputs/bundle/release/
        retention-days: 7

    - name: Upload reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ steps.artifact-name.outputs.name }}-reports
        path: |
          **/build/reports/detekt/
          **/build/reports/tests/**
          **/build/reports/lint-results-*.html
        retention-days: 7

  ai-merge-queue:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ai/')
    runs-on: ubuntu-latest
    needs: [ai-branch-test]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 36
        build-tools: 36.0.0
        ndk-version: '28.2.13676358'
        cmake-version: '4.1.1'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Final build test
      run: ./gradlew assembleDebugApp assembleReleaseApp --configuration-cache --build-cache

    - name: Approve for merge
      if: success()
      run: |
        echo "✅ AI branch approved for merge to main"
        echo "Branch: ${{ github.head_ref }}"
        echo "All validations passed"

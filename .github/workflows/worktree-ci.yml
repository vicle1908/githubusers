name: Worktree CI/CD

on:
  push:
    branches: ['ai/**', 'feature/**', 'bugfix/**', 'hotfix/**']
  pull_request:
    branches: ['ai/**', 'feature/**', 'bugfix/**', 'hotfix/**']
  workflow_dispatch:
    inputs:
      branch_pattern:
        description: 'Branch pattern to test (e.g., ai/**)'
        required: false
        default: 'ai/**'
        type: string

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

permissions:
  contents: write

jobs:
  # Job for AI branches
  ai-branch-test:
    if: startsWith(github.ref, 'refs/heads/ai/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]
        gradle-version: [9.0.0]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    
    - name: Validate AI branch naming
      run: |
        BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        if [[ ! "$BRANCH_NAME" =~ ^ai/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+$ ]]; then
          echo "❌ Invalid AI branch naming: $BRANCH_NAME"
          echo "Expected pattern: ai/<assistant>/<issue-id>/<task-description>"
          exit 1
        fi
        echo "✅ Valid AI branch naming: $BRANCH_NAME"
    
    - name: Extract branch info
      id: branch-info
      run: |
        BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        IFS='/' read -r -a PARTS <<< "$BRANCH_NAME"
        echo "assistant=${PARTS[1]}" >> $GITHUB_OUTPUT
        echo "issue_id=${PARTS[2]}" >> $GITHUB_OUTPUT
        echo "task_description=${PARTS[3]}" >> $GITHUB_OUTPUT
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
    
    - name: Configure sparse-checkout for AI task
      run: |
        TASK_TYPE="${{ steps.branch-info.outputs.task_description }}"
        if [[ "$TASK_TYPE" =~ (navigation|nav) ]]; then
          SPARSE_PATTERN="app navigation-api navigation-impl feature-users feature-search feature-settings core-ui"
        elif [[ "$TASK_TYPE" =~ (ui|compose|screen) ]]; then
          SPARSE_PATTERN="app feature-users feature-search feature-settings core-ui core-design"
        elif [[ "$TASK_TYPE" =~ (data|repository|api) ]]; then
          SPARSE_PATTERN="core-data feature-users feature-search feature-settings app/src/main/java/com/example/githubusers/di"
        elif [[ "$TASK_TYPE" =~ (test|testing) ]]; then
          SPARSE_PATTERN="app feature-users feature-search feature-settings core-common core-mvi core-networking core-storage core-ui plugins docs"
        elif [[ "$TASK_TYPE" =~ (plugin|build|gradle) ]]; then
          SPARSE_PATTERN="plugins build-logic catalog app/build.gradle.kts"
        else
          SPARSE_PATTERN="app feature-users feature-search feature-settings core-common core-mvi core-networking core-storage core-ui plugins docs scripts"
        fi
        
        echo "SPARSE_PATTERN=$SPARSE_PATTERN" >> $GITHUB_ENV
        echo "Configuring sparse-checkout for task: $TASK_TYPE"
        echo "Patterns: $SPARSE_PATTERN"
    
    - name: Run quality checks
      run: |
        echo "Running quality checks for AI branch: ${{ steps.branch-info.outputs.branch_name }}"
        echo "Assistant: ${{ steps.branch-info.outputs.assistant }}"
        echo "Issue ID: ${{ steps.branch-info.outputs.issue_id }}"
        echo "Task: ${{ steps.branch-info.outputs.task_description }}"

        # Run Detekt for code quality
        ./gradlew detektAll

        # Run KtLint for code formatting
        ./gradlew ktlintCheckAll
    
    - name: Run tests
      run: |
        # Run unit tests (aggregate across composite builds)
        ./gradlew testAll
        
        # Run integration tests if available (placeholder aggregates to no-op)
        ./gradlew integrationTest || echo "No integration tests found"
    
    - name: Build project
      run: |
        # Build debug variant
        ./gradlew :app:assembleDebug
        
        # Build release variant
        ./gradlew :app:assembleRelease
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ai-branch-build-${{ steps.branch-info.outputs.assistant }}-${{ steps.branch-info.outputs.issue_id }}
        path: |
          app/build/outputs/apk/debug/
          app/build/outputs/apk/release/
        retention-days: 7
    
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { assistant, issue_id, task_description } = ${{ toJson(steps.branch-info.outputs) }};
          const comment = `🤖 **AI Branch CI Results**
          
          **Branch**: \`${{ steps.branch-info.outputs.branch_name }}\`
          **Assistant**: ${assistant}
          **Issue ID**: ${issue_id}
          **Task**: ${task_description}
          
          ✅ All quality checks passed
          ✅ All tests passed
          ✅ Build successful
          
          This AI branch is ready for review and merge.`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

  # Job for feature branches
  feature-branch-test:
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]
        gradle-version: [9.0.0]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    
    - name: Validate feature branch naming
      run: |
        BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        if [[ ! "$BRANCH_NAME" =~ ^feature/[a-zA-Z0-9_-]+$ ]]; then
          echo "❌ Invalid feature branch naming: $BRANCH_NAME"
          echo "Expected pattern: feature/<description>"
          exit 1
        fi
        echo "✅ Valid feature branch naming: $BRANCH_NAME"
    
    - name: Run quality checks
      run: |
        ./gradlew detektAll ktlintCheckAll
    
    - name: Run tests
      run: |
        ./gradlew testAll integrationTest || echo "No integration tests found"
    
    - name: Build project
      run: |
        ./gradlew :app:assembleDebug :app:assembleRelease
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: feature-branch-build-${{ github.ref_name }}
        path: |
          app/build/outputs/apk/debug/
          app/build/outputs/apk/release/
        retention-days: 7

  # Job for bugfix branches
  bugfix-branch-test:
    if: startsWith(github.ref, 'refs/heads/bugfix/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]
        gradle-version: [9.0.0]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    
    - name: Validate bugfix branch naming
      run: |
        BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        if [[ ! "$BRANCH_NAME" =~ ^bugfix/[a-zA-Z0-9_-]+$ ]]; then
          echo "❌ Invalid bugfix branch naming: $BRANCHNAME"
          echo "Expected pattern: bugfix/<description>"
          exit 1
        fi
        echo "✅ Valid bugfix branch naming: $BRANCH_NAME"
    
    - name: Run quality checks
      run: |
        ./gradlew detektAll ktlintCheckAll
    
    - name: Run tests
      run: |
        ./gradlew testAll integrationTest || echo "No integration tests found"
    
    - name: Build project
      run: |
        ./gradlew :app:assembleDebug :app:assembleRelease
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: bugfix-branch-build-${{ github.ref_name }}
        path: |
          app/build/outputs/apk/debug/
          app/build/outputs/apk/release/
        retention-days: 7

  # Job for hotfix branches
  hotfix-branch-test:
    if: startsWith(github.ref, 'refs/heads/hotfix/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]
        gradle-version: [9.0.0]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    
    - name: Validate hotfix branch naming
      run: |
        BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        if [[ ! "$BRANCH_NAME" =~ ^hotfix/[a-zA-Z0-9_-]+$ ]]; then
          echo "❌ Invalid hotfix branch naming: $BRANCH_NAME"
          echo "Expected pattern: hotfix/<description>"
          exit 1
        fi
        echo "✅ Valid hotfix branch naming: $BRANCH_NAME"
    
    - name: Run quality checks
      run: |
        ./gradlew detektAll ktlintCheckAll
    
    - name: Run tests
      run: |
        ./gradlew test integrationTest || echo "No integration tests found"
    
    - name: Build project
      run: |
        ./gradlew :app:assembleDebug :app:assembleRelease
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: hotfix-branch-build-${{ github.ref_name }}
        path: |
          app/build/outputs/apk/debug/
          app/build/outputs/apk/release/
        retention-days: 7

  # Merge queue job for AI branches
  ai-merge-queue:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ai/')
    runs-on: ubuntu-latest
    needs: [ai-branch-test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    
    - name: Merge queue validation
      run: |
        echo "🤖 AI Branch Merge Queue Validation"
        echo "Branch: ${{ github.head_ref }}"
        echo "PR: #${{ github.event.number }}"
        
        # Validate that the AI branch follows naming convention
        if [[ ! "${{ github.head_ref }}" =~ ^ai/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+/[a-zA-Z0-9_-]+$ ]]; then
          echo "❌ Invalid AI branch naming in merge queue"
          exit 1
        fi
        
        # Check for conflicts with main
        git fetch origin main
        if ! git merge-base --is-ancestor origin/main HEAD; then
          echo "⚠️  Branch is not up to date with main"
          echo "Please rebase your branch on main before merging"
          exit 1
        fi
        
        echo "✅ AI branch ready for merge"
    
    - name: Final build test
      run: |
        ./gradlew build
    
    - name: Approve for merge
      if: success()
      run: |
        echo "✅ AI branch approved for merge to main"
        echo "Branch: ${{ github.head_ref }}"
        echo "All validations passed"

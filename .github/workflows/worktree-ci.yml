name: Worktree CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      branch_pattern:
        description: 'Branch pattern to test (e.g., ai/**)'
        required: false
        default: 'ai/**'
        type: string

concurrency:
  group: worktree-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

permissions:
  contents: read

jobs:
  android-toolchain:
    uses: ./.github/workflows/android-toolchain-versions.yml

  branch-validation:
    name: Branch Validation (${{ matrix.id }})
    runs-on: ubuntu-latest
    needs: android-toolchain
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - id: ai
            branch_prefix: 'ai/'
            artifact_prefix: 'ai-branch-build'
            run_lint: true
            run_integration: true
            run_release: true
            require_native: true
            verify_apk: true
            validate_name: false
          - id: feature
            branch_prefix: 'feature/'
            artifact_prefix: 'feature-branch-build'
            run_lint: true
            run_integration: false
            run_release: false
            require_native: false
            verify_apk: false
            validate_name: false
          - id: bugfix
            branch_prefix: 'bugfix/'
            artifact_prefix: 'bugfix-branch-build'
            run_lint: false
            run_integration: false
            run_release: false
            require_native: false
            verify_apk: false
            validate_name: true
          - id: hotfix
            branch_prefix: 'hotfix/'
            artifact_prefix: 'hotfix-branch-build'
            run_lint: true
            run_integration: true
            run_release: true
            require_native: true
            verify_apk: true
            validate_name: false
    env:
      ANDROID_API_LEVEL: ${{ needs.android-toolchain.outputs.android-api-level }}
      ANDROID_BUILD_TOOLS: ${{ needs.android-toolchain.outputs.android-build-tools }}
      ANDROID_NDK_VERSION: ${{ needs.android-toolchain.outputs.android-ndk-version }}
      ANDROID_CMAKE_VERSION: ${{ needs.android-toolchain.outputs.android-cmake-version }}
    steps:
    - name: Determine branch eligibility
      id: branch_filter
      shell: bash
      run: |
        set -euo pipefail
        BRANCH_PREFIX="${{ matrix.branch_prefix }}"
        RUN_JOB=false

        case "${GITHUB_EVENT_NAME}" in
          push)
            if [[ "${GITHUB_REF}" == refs/heads/${BRANCH_PREFIX}* ]]; then
              RUN_JOB=true
            fi
            ;;
          pull_request)
            if [[ "${GITHUB_HEAD_REF}" == ${BRANCH_PREFIX}* ]]; then
              RUN_JOB=true
            fi
            ;;
          workflow_dispatch)
            PATTERN="${{ inputs.branch_pattern }}"
            if [[ -z "$PATTERN" ]]; then
              PATTERN='*'
            fi
            PREFIX="$PATTERN"
            if [[ "$PATTERN" == *\** ]]; then
              PREFIX="${PATTERN%%\**}"
            fi
            if [[ "$BRANCH_PREFIX" == "$PREFIX"* ]]; then
              RUN_JOB=true
            fi
            ;;
        esac

        echo "run_job=$RUN_JOB" >> "$GITHUB_OUTPUT"
        if [[ "$RUN_JOB" == false ]]; then
          echo "Skipping matrix '${{ matrix.id }}' for event ${GITHUB_EVENT_NAME}"
        fi
    - name: Checkout repository
      if: steps.branch_filter.outputs.run_job == 'true'
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      with:
        fetch-depth: 0

    - name: Prepare Gradle environment
      if: steps.branch_filter.outputs.run_job == 'true'
      uses: ./.github/actions/gradle-android-setup
      with:
        android-api-level: ${{ env.ANDROID_API_LEVEL }}
        android-build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
        android-ndk-version: ${{ env.ANDROID_NDK_VERSION }}
        android-cmake-version: ${{ env.ANDROID_CMAKE_VERSION }}

    - name: Validate bugfix branch naming
      if: steps.branch_filter.outputs.run_job == 'true' && matrix.validate_name
      run: |
        BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
        if [[ ! "$BRANCH_NAME" =~ ^bugfix/[a-zA-Z0-9_-]+$ ]]; then
          echo "❌ Invalid bugfix branch naming: $BRANCH_NAME"
          echo "Expected pattern: bugfix/<description>"
          exit 1
        fi
        echo "✅ Valid bugfix branch naming: $BRANCH_NAME"

    - name: Run static analysis
      if: steps.branch_filter.outputs.run_job == 'true'
      run: ./gradlew detektAll ktlintCheckAll --configuration-cache --build-cache

    - name: Run Android lint
      if: steps.branch_filter.outputs.run_job == 'true' && matrix.run_lint
      run: ./gradlew lintAll --configuration-cache --build-cache

    - name: Run tests
      if: steps.branch_filter.outputs.run_job == 'true'
      run: |
        set -eo pipefail
        if [ "${{ matrix.run_integration }}" = 'true' ]; then
          ./gradlew testAll integrationTest --configuration-cache --build-cache || {
            echo "Integration suite unavailable; rerunning without it"
            ./gradlew testAll --configuration-cache --build-cache
          }
        else
          ./gradlew testAll --configuration-cache --build-cache
        fi

    - name: Verify native library build
      if: steps.branch_filter.outputs.run_job == 'true' && matrix.require_native
      run: |
        echo "Building native libraries for core-security module..."
        ./gradlew :core-security:assembleDebug --configuration-cache --build-cache --info
        if [ -d "core-security/build/intermediates/cxx" ]; then
          echo "✅ Native libraries build directory found"
          find core-security/build/intermediates/cxx -name "*.so" -type f | head -5 || echo "No .so files found yet"
        else
          echo "❌ Native libraries build directory not found"
          exit 1
        fi

    - name: Build artifacts
      if: steps.branch_filter.outputs.run_job == 'true'
      run: |
        set -eo pipefail
        TASKS=(assembleDebugApp)
        if [ "${{ matrix.run_release }}" = 'true' ]; then
          TASKS+=(assembleReleaseApp)
        fi
        ./gradlew "${TASKS[@]}" --configuration-cache --build-cache

    - name: Verify native integration
      if: steps.branch_filter.outputs.run_job == 'true' && matrix.verify_apk
      run: |
        echo "Checking native library integration in APK..."
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          if ! unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "\\.so$"; then
            echo "No native libraries found in APK"
            exit 1
          fi
        else
          echo "Debug APK not found"
          exit 1
        fi

    - name: Compute artifact name
      id: artifact-name
      run: |
        BRANCH="${{ github.head_ref || github.ref_name }}"
        SAFE_BRANCH=$(echo "$BRANCH" | tr '/":<>|*?\\' '-')
        echo "name=${{ matrix.artifact_prefix }}-$SAFE_BRANCH" >> "$GITHUB_OUTPUT"

    - name: Upload build artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: success()
      with:
        name: ${{ steps.artifact-name.outputs.name }}
        path: |
          app/build/outputs/apk/debug/
          app/build/outputs/apk/release/
          app/build/outputs/bundle/release/
        retention-days: 7
        compression-level: 6
        if-no-files-found: ignore

    - name: Upload reports
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: ${{ steps.artifact-name.outputs.name }}-reports
        path: |
          **/build/reports/detekt/
          **/build/reports/tests/**
          **/build/reports/lint-results-*.html
        retention-days: 7
        compression-level: 6
        if-no-files-found: ignore

  ai-merge-queue:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ai/')
    runs-on: ubuntu-latest
    needs: [android-toolchain, branch-validation]
    env:
      ANDROID_API_LEVEL: ${{ needs.android-toolchain.outputs.android-api-level }}
      ANDROID_BUILD_TOOLS: ${{ needs.android-toolchain.outputs.android-build-tools }}
      ANDROID_NDK_VERSION: ${{ needs.android-toolchain.outputs.android-ndk-version }}
      ANDROID_CMAKE_VERSION: ${{ needs.android-toolchain.outputs.android-cmake-version }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      with:
        fetch-depth: 0

    - name: Prepare Gradle environment
      uses: ./.github/actions/gradle-android-setup
      with:
        android-api-level: ${{ env.ANDROID_API_LEVEL }}
        android-build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
        android-ndk-version: ${{ env.ANDROID_NDK_VERSION }}
        android-cmake-version: ${{ env.ANDROID_CMAKE_VERSION }}

    - name: Final build test
      run: ./gradlew assembleDebugApp assembleReleaseApp --configuration-cache --build-cache

    - name: Approve for merge
      if: success()
      run: |
        echo "✅ AI branch approved for merge to main"
        echo "Branch: ${{ github.head_ref }}"
        echo "All validations passed"

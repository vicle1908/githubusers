name: Security & Maintenance

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'catalog/gradle/libs.versions.toml'
      - '**/build.gradle.kts'
      - 'gradle/wrapper/gradle-wrapper.properties'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC"

jobs:
  android-toolchain:
    uses: ./.github/workflows/android-toolchain-versions.yml

  dependency-updates:
    name: Dependency Update Check
    runs-on: ubuntu-latest
    needs: android-toolchain
    env:
      ANDROID_API_LEVEL: ${{ needs.android-toolchain.outputs.android-api-level }}
      ANDROID_BUILD_TOOLS: ${{ needs.android-toolchain.outputs.android-build-tools }}
      ANDROID_NDK_VERSION: ${{ needs.android-toolchain.outputs.android-ndk-version }}
      ANDROID_CMAKE_VERSION: ${{ needs.android-toolchain.outputs.android-cmake-version }}
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

    - name: Prepare Gradle environment
      uses: ./.github/actions/gradle-android-setup
      with:
        android-api-level: ${{ env.ANDROID_API_LEVEL }}
        android-build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
        android-ndk-version: ${{ env.ANDROID_NDK_VERSION }}
        android-cmake-version: ${{ env.ANDROID_CMAKE_VERSION }}
    
    - name: Check for dependency updates (no CC)
      run: ./gradlew dependencyUpdatesAll --no-configuration-cache --build-cache --stacktrace
    
    - name: Upload dependency update report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: dependency-update-report
        path: |
          **/build/dependencyUpdates/
        retention-days: 30
        compression-level: 6
        if-no-files-found: ignore
    
    - name: Create dependency update summary
      run: |
        echo "## Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
        if [ -f build/dependencyUpdates/report.txt ]; then
          echo "### Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat build/dependencyUpdates/report.txt | head -50 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: android-toolchain
    env:
      CODEQL_EXTRACTOR_JAVA_OPTION_BUILD_TRACING: ON
      ANDROID_API_LEVEL: ${{ needs.android-toolchain.outputs.android-api-level }}
      ANDROID_BUILD_TOOLS: ${{ needs.android-toolchain.outputs.android-build-tools }}
      ANDROID_NDK_VERSION: ${{ needs.android-toolchain.outputs.android-ndk-version }}
      ANDROID_CMAKE_VERSION: ${{ needs.android-toolchain.outputs.android-cmake-version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

    - name: Prepare Gradle environment
      uses: ./.github/actions/gradle-android-setup
      with:
        android-api-level: ${{ env.ANDROID_API_LEVEL }}
        android-build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
        android-ndk-version: ${{ env.ANDROID_NDK_VERSION }}
        android-cmake-version: ${{ env.ANDROID_CMAKE_VERSION }}
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@961a4b1d9fb3daa7752609b0dde99ee1020dccac
      with:
        languages: java-kotlin
    
    - name: Build for CodeQL
      run: ./gradlew assembleDebugApp --configuration-cache --build-cache --rerun-tasks
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@961a4b1d9fb3daa7752609b0dde99ee1020dccac
      with:
        category: "/language:java-kotlin"
    
    - name: Run OWASP Dependency Check
      run: ./gradlew dependencyCheckAnalyzeAll --no-configuration-cache --build-cache
    
    - name: Upload security scan results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: security-scan-results
        path: |
          **/build/reports/dependency-check-report.*
        retention-days: 30
        compression-level: 6
        if-no-files-found: ignore

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: android-toolchain
    env:
      ANDROID_API_LEVEL: ${{ needs.android-toolchain.outputs.android-api-level }}
      ANDROID_BUILD_TOOLS: ${{ needs.android-toolchain.outputs.android-build-tools }}
      ANDROID_NDK_VERSION: ${{ needs.android-toolchain.outputs.android-ndk-version }}
      ANDROID_CMAKE_VERSION: ${{ needs.android-toolchain.outputs.android-cmake-version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

    - name: Prepare Gradle environment
      uses: ./.github/actions/gradle-android-setup
      with:
        android-api-level: ${{ env.ANDROID_API_LEVEL }}
        android-build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
        android-ndk-version: ${{ env.ANDROID_NDK_VERSION }}
        android-cmake-version: ${{ env.ANDROID_CMAKE_VERSION }}
    
    - name: Generate license report
      run: ./gradlew generateLicenseReportAll --no-configuration-cache --build-cache
    
    - name: Upload license report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: license-report
        path: |
          **/build/reports/dependency-license/
        retention-days: 30
        compression-level: 6
        if-no-files-found: ignore

  performance-benchmark:
    name: Performance Benchmarking
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: android-toolchain
    env:
      ANDROID_API_LEVEL: ${{ needs.android-toolchain.outputs.android-api-level }}
      ANDROID_BUILD_TOOLS: ${{ needs.android-toolchain.outputs.android-build-tools }}
      ANDROID_NDK_VERSION: ${{ needs.android-toolchain.outputs.android-ndk-version }}
      ANDROID_CMAKE_VERSION: ${{ needs.android-toolchain.outputs.android-cmake-version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

    - name: Prepare Gradle environment
      uses: ./.github/actions/gradle-android-setup
      with:
        android-api-level: ${{ env.ANDROID_API_LEVEL }}
        android-build-tools: ${{ env.ANDROID_BUILD_TOOLS }}
        android-ndk-version: ${{ env.ANDROID_NDK_VERSION }}
        android-cmake-version: ${{ env.ANDROID_CMAKE_VERSION }}
    
    - name: Build release APK for analysis
      run: ./gradlew assembleReleaseApp --configuration-cache --build-cache
    
    - name: APK Analysis
      run: |
        echo "## Performance Analysis" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # APK size analysis
        echo "### APK Size Analysis" >> $GITHUB_STEP_SUMMARY
        echo "| APK Type | Size | Path |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|------|------|" >> $GITHUB_STEP_SUMMARY
        find app/build/outputs/apk -name "*.apk" -exec sh -c 'echo "| $(basename $(dirname {})) | $(du -h {} | cut -f1) | {} |"' \; >> $GITHUB_STEP_SUMMARY
        
        # Method count (if tools available)
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Information" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        
        # Gradle build scan
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Performance" >> $GITHUB_STEP_SUMMARY
        echo "Check Gradle build cache effectiveness and build performance in the Gradle build scan." >> $GITHUB_STEP_SUMMARY

  code-metrics:
    name: Code Quality Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      with:
        fetch-depth: 0

    - name: Prepare Gradle environment
      uses: ./.github/actions/gradle-android-setup
      with:
        install-android: 'false'

    - name: Generate code metrics
      run: |
        # Count lines of code
        echo "## Code Metrics Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### Lines of Code" >> $GITHUB_STEP_SUMMARY
        echo "| Language | Files | Lines |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|-------|" >> $GITHUB_STEP_SUMMARY
        
        # Kotlin files
        KOTLIN_FILES=$(find . -name "*.kt" -not -path "./build/*" -not -path "./.gradle/*" | wc -l)
        KOTLIN_LINES=$(find . -name "*.kt" -not -path "./build/*" -not -path "./.gradle/*" -exec wc -l {} + | tail -1 | awk '{print $1}')
        echo "| Kotlin | $KOTLIN_FILES | $KOTLIN_LINES |" >> $GITHUB_STEP_SUMMARY
        
        # Java files
        JAVA_FILES=$(find . -name "*.java" -not -path "./build/*" -not -path "./.gradle/*" | wc -l)
        if [ $JAVA_FILES -gt 0 ]; then
          JAVA_LINES=$(find . -name "*.java" -not -path "./build/*" -not -path "./.gradle/*" -exec wc -l {} + | tail -1 | awk '{print $1}')
          echo "| Java | $JAVA_FILES | $JAVA_LINES |" >> $GITHUB_STEP_SUMMARY
        fi
        
        # XML files
        XML_FILES=$(find . -name "*.xml" -not -path "./build/*" -not -path "./.gradle/*" | wc -l)
        if [ $XML_FILES -gt 0 ]; then
          XML_LINES=$(find . -name "*.xml" -not -path "./build/*" -not -path "./.gradle/*" -exec wc -l {} + | tail -1 | awk '{print $1}')
          echo "| XML | $XML_FILES | $XML_LINES |" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Module Distribution" >> $GITHUB_STEP_SUMMARY
        echo "| Module | Kotlin Files |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|--------------|" >> $GITHUB_STEP_SUMMARY
        for module in $(find . -name "build.gradle.kts" -not -path "./build/*" | sed 's/\/build.gradle.kts//' | sed 's/\.\///' | sort); do
          if [ -d "$module" ]; then
            MODULE_FILES=$(find "$module" -name "*.kt" -not -path "./build/*" | wc -l)
            echo "| $module | $MODULE_FILES |" >> $GITHUB_STEP_SUMMARY
          fi
        done

  notify-maintenance:
    name: Maintenance Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [dependency-updates, security-scan, license-check, performance-benchmark, code-metrics]
    
    steps:
    - name: Create maintenance summary
      run: |
        echo "## Security & Maintenance Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Updates | ${{ needs.dependency-updates.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| License Check | ${{ needs.license-check.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance Benchmark | ${{ needs.performance-benchmark.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Code Metrics | ${{ needs.code-metrics.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Scheduled Run:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY

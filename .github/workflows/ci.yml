name: Enhanced CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC"

jobs:
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 36
        build-tools: 36.0.0
        ndk-version: '28.2.13676358'
        cmake-version: '4.1.1'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # No separate plugins build needed; root tasks cover this

    - name: Run Detekt
      run: ./gradlew detektAll --configuration-cache --build-cache

    - name: Run ktlint
      run: ./gradlew ktlintCheckAll --configuration-cache --build-cache

    - name: Run Android Lint
      run: ./gradlew :app:lintDebug --configuration-cache --build-cache

    # Check if we can compile core-security native library
    - name: Check core-security compilation
      run: ./gradlew :core-security:compileDebugKotlin --configuration-cache --build-cache
      continue-on-error: true

    - name: Upload Detekt results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: detekt-results-${{ github.run_number }}
        path: |
          **/build/reports/detekt/
        retention-days: 30
        compression-level: 6
        if-no-files-found: ignore

    - name: Upload Lint results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-results-${{ github.run_number }}
        path: |
          **/build/reports/lint-results-*.html
        retention-days: 30
        compression-level: 6
        if-no-files-found: ignore

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: code-quality
    permissions:
      checks: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 36
        build-tools: 36.0.0
        ndk-version: '28.2.13676358'
        cmake-version: '4.1.1'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Run unit tests
      run: ./gradlew testAll --configuration-cache --build-cache

    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results
        path: '**/build/test-results/test*/TEST-*.xml'
        reporter: java-junit
        fail-on-error: false
        fail-on-empty: false
        max-annotations: '50'

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-${{ github.run_number }}
        path: |
          **/build/test-results/
          **/build/reports/tests/
        retention-days: 30
        compression-level: 6
        if-no-files-found: ignore

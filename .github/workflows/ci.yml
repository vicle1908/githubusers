name: Enhanced CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC"

jobs:
  code-quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    # No separate plugins build needed; root tasks cover this
    
    - name: Run Detekt
      run: ./gradlew detektAll --configuration-cache --build-cache

    - name: Run ktlint
      run: ./gradlew ktlintCheckAll --configuration-cache --build-cache
    
    - name: Run Android Lint
      run: ./gradlew lintDebug --configuration-cache --build-cache
    
    - name: Upload Detekt results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: detekt-results
        path: |
          **/build/reports/detekt/
        retention-days: 30
    
    - name: Upload Lint results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-results
        path: |
          **/build/reports/lint-results-*.html
        retention-days: 30

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: code-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # Gradle cache handled by setup-gradle
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Run unit tests
      run: ./gradlew testAll --configuration-cache --build-cache
    
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results
        path: '**/build/test-results/**/TEST-*.xml'
        reporter: java-junit
        fail-on-error: true
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: |
          **/build/test-results/**
          **/build/reports/tests/**
        retention-days: 30

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: code-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # Gradle cache handled by setup-gradle
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        cache-read-only: ${{ github.event_name == 'pull_request' }}
        dependency-graph: generate-and-submit
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Build debug APK
      run: ./gradlew assembleDebug --configuration-cache --build-cache
    
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

  performance-tests:
    name: Performance Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # Gradle cache handled by setup-gradle
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        cache-read-only: ${{ github.event_name == 'pull_request' }}
        dependency-graph: generate-and-submit
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Analyze APK size
      run: |
        ./gradlew assembleRelease --configuration-cache --build-cache
        echo "## APK Size Analysis" >> $GITHUB_STEP_SUMMARY
        echo "| APK | Size |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|------|" >> $GITHUB_STEP_SUMMARY
        find . -name "*.apk" -exec echo "|{}|$(du -h {} | cut -f1)|" \; >> $GITHUB_STEP_SUMMARY

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [unit-tests, build, performance-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-home-cache-cleanup: true
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Build release APK
      run: ./gradlew assembleRelease --configuration-cache --build-cache
    
    - name: Build release AAB
      run: ./gradlew bundleRelease --configuration-cache --build-cache
    
    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 90
    
    - name: Upload release AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/app-release.aab
        retention-days: 90

  notify:
    name: Build Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [code-quality, unit-tests, build, performance-tests]
    
    steps:
    - name: Create build summary
      run: |
        echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

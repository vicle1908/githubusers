name: Prepare Gradle build
description: Standard checkout and tooling setup for Gradle builds with optional Android SDK provisioning.
inputs:
  java-version:
    description: Java version to install.
    required: false
    default: '21'
  java-distribution:
    description: Java distribution to install.
    required: false
    default: 'temurin'
  install-android:
    description: Whether to install the Android SDK components.
    required: false
    default: 'true'
  android-api-level:
    description: Android API level to install when provisioning the SDK.
    required: false
  android-build-tools:
    description: Android build tools version to install when provisioning the SDK.
    required: false
  android-ndk-version:
    description: Android NDK version to install when provisioning the SDK.
    required: false
  android-cmake-version:
    description: CMake version to install when provisioning the SDK.
    required: false
runs:
  using: composite
  steps:
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - name: Setup Android SDK
      if: inputs.install-android == 'true'
      uses: android-actions/setup-android@v3
      with:
        packages: >-
          tools
          platform-tools
          platforms;android-${{ inputs.android-api-level }}
          build-tools;${{ inputs.android-build-tools }}
          ndk;${{ inputs.android-ndk-version }}
          cmake;${{ inputs.android-cmake-version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-cleanup: on-success
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Make Gradle wrapper executable
      shell: bash
      run: chmod +x ./gradlew

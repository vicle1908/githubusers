# Module-specific Gradle properties for internal-platform
# JVM memory settings - minimal for platform module (no compilation)
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Gradle optimizations
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Kotlin incremental compilation
kotlin.incremental=true

# KSP incremental processing
ksp.incremental=true
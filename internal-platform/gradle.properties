# =============================================================================
# Module-specific Gradle properties for internal-platform module
# Optimized for Java platform modules in composite builds
# Gradle 9.0.0 + Android 8.12.2 Optimizations
# LATEST OPTIMIZATIONS: 2024 Research-Based Updates
# =============================================================================

# =============================================================================
# PLATFORM MODULE OPTIMIZATIONS
# =============================================================================
# Platform modules don't need Android properties
# Platform modules don't need Kotlin compilation properties
# Platform modules don't need KSP properties

# =============================================================================
# MINIMAL MEMORY SETTINGS (ENHANCED)
# =============================================================================
# Platform modules need minimal memory settings
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC

# =============================================================================
# GRADLE 9.0.0 PLATFORM LATEST OPTIMIZATIONS
# =============================================================================
# Platform module performance settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# NEW: Module-specific configuration cache
org.gradle.configuration-cache=true

# NEW: Enhanced module performance
org.gradle.workers.max=4
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# =============================================================================
# COMPOSITE BUILD PLATFORM LATEST OPTIMIZATIONS
# =============================================================================
# Platform module specific settings for composite builds
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache-problems=warn

# NEW: Enhanced composite build settings
org.gradle.unsafe.isolated-projects=true
org.gradle.caching.reuse=true

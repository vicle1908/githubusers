# =============================================================================
# Module-specific Gradle properties for feature-settings module
# Mirrors feature-users for consistency in composite builds
# =============================================================================

# ESSENTIAL ANDROID PROPERTIES
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.enableResourceOptimizations=true

# ESSENTIAL KOTLIN PROPERTIES
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.incremental.compiler.gradle=true

# ESSENTIAL KSP PROPERTIES
ksp.incremental=true
ksp.useWorkerApi=true
ksp.verbose=false

# GRADLE PERFORMANCE
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# FEATURE MODULE OPTIMIZATIONS
android.lifecycleProcessor.incremental=true
android.enableComposeCompilerReports=true
android.enableComposeCompilerMetrics=true

# COMPOSITE BUILD OPTIMIZATIONS
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache-problems=warn
org.gradle.unsafe.isolated-projects=true
org.gradle.caching.reuse=true





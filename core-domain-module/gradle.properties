# =============================================================================
# Module-specific Gradle properties for core-domain-module
# Optimized for Android core modules in composite builds
# Gradle 9.0.0 + Android 8.12.2 Optimizations
# LATEST OPTIMIZATIONS: 2024 Research-Based Updates
# =============================================================================

# =============================================================================
# ESSENTIAL ANDROID PROPERTIES (REQUIRED)
# =============================================================================
# Android settings (required for Android modules)
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# NEW: AGP 8.12.2 specific optimizations
android.enableBuildCache=true
android.enableResourceOptimizations=true

# =============================================================================
# ESSENTIAL KOTLIN PROPERTIES (REQUIRED)
# =============================================================================
# Kotlin incremental compilation
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.code.style=official

# NEW: Kotlin 2.2.0 specific optimizations
kotlin.incremental.compiler.gradle=true
kotlin.incremental.useClasspathSnapshot=true

# =============================================================================
# ESSENTIAL KSP PROPERTIES (REQUIRED)
# =============================================================================
# KSP annotation processing
ksp.incremental=true

# NEW: Enhanced KSP for AGP 8.12.2
ksp.useWorkerApi=true
ksp.verbose=false

# =============================================================================
# GRADLE 9.0.0 MODULE LATEST OPTIMIZATIONS
# =============================================================================
# Module-specific performance settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# NEW: Module-specific configuration cache
org.gradle.configuration-cache=true

# NEW: Enhanced module performance
org.gradle.workers.max=4
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# =============================================================================
# COMPOSITE BUILD LATEST OPTIMIZATIONS
# =============================================================================
# Core module specific settings for composite builds
org.gradle.unsafe.configuration-cache=true
org.gradle.unsafe.configuration-cache-problems=warn

# NEW: Enhanced composite build settings
org.gradle.unsafe.isolated-projects=true
org.gradle.caching.reuse=true

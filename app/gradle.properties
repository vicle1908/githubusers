# =============================================================================
# Module-specific Gradle properties for app module
# Optimized for Android application modules in composite builds
# Gradle 9.0.0 + Android 8.12.2 Optimizations
# LATEST OPTIMIZATIONS: 2024 Research-Based Updates
# =============================================================================

# =============================================================================
# ESSENTIAL ANDROID PROPERTIES (REQUIRED)
# =============================================================================
# Android settings (required for app module)
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# NEW: AGP 8.12.2 specific optimizations
android.enableResourceOptimizations=true
android.enableR8.fullMode=true

# =============================================================================
# ESSENTIAL KOTLIN PROPERTIES (REQUIRED)
# =============================================================================
# Kotlin incremental compilation
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true

# NEW: Kotlin 2.2.0 specific optimizations
kotlin.incremental.compiler.gradle=true

# =============================================================================
# ESSENTIAL KSP PROPERTIES (REQUIRED)
# =============================================================================
# KSP annotation processing
ksp.incremental=true

# NEW: Enhanced KSP for AGP 8.12.2
ksp.useWorkerApi=true
ksp.verbose=false

# =============================================================================
# GRADLE 9.0.0 MODULE LATEST OPTIMIZATIONS
# =============================================================================
# Parallel execution and build cache are ENABLED BY DEFAULT in Gradle 9.0.0
# Configuration cache is ENABLED BY DEFAULT in Gradle 9.0.0

# NEW: Enhanced module performance
org.gradle.workers.max=8
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# =============================================================================
# ANDROID 8.12.2 MODULE LATEST OPTIMIZATIONS
# =============================================================================
# Enable R8 full mode for app modules (better optimization)
android.enableR8.fullMode=true

# NEW: Enhanced Android optimizations
android.enableBuildConfigAsBytecode=true

# =============================================================================
# COMPOSE MODULE LATEST OPTIMIZATIONS
# =============================================================================
# Compose compiler optimizations are ENABLED BY DEFAULT in AGP 8.12.2
# No need to explicitly enable - Android automatically uses them

# =============================================================================
# KSP MODULE LATEST OPTIMIZATIONS
# =============================================================================
# KSP optimizations for app module
ksp.incremental.log=true
ksp.workers.isolation=false

# NEW: Enhanced KSP settings
ksp.useWorkerApi=true
ksp.verbose=false

# NEW: Missing Critical Android Build Optimizations
# =============================================================================
# ANDROID BUILD FEATURES OPTIMIZATION
# =============================================================================
# Build Features Optimization (from Android Build Guide)
android.buildFeatures.buildConfig=false
android.buildFeatures.viewBinding=true
android.buildFeatures.dataBinding=false

# NEW: Build Variant Optimization
android.buildTypes.release.minifyEnabled=true
android.buildTypes.release.shrinkResources=true

# NEW: Resource Processing Optimization
android.enableResourceOptimizations=true

# NEW: Test Optimization
android.experimental.testOptions.managedDevices.setupTimeoutMinutes=10
android.experimental.testOptions.managedDevices.emulator.showKernelLogging=false

# NEW: Compose Compiler Advanced Optimization
# All Compose compiler optimizations are ENABLED BY DEFAULT in AGP 8.12.2
